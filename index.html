:root{
  --bg:#0b1026;
  --surface:rgba(255,255,255,.08);
  --surface2:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.14);
  --text:#f8f7ff;
  --muted:#c7c9e8;
  --red:#ff3b5c;
  --gold:#ffd166;
  --green:#22d3a5;
  --violet:#7c5cff;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#070a1c;
  }
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  height:100%;
  overflow:hidden
}

body{
  font-family:ui-sans-system,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--text);
  background:var(--bg)
}

button{
  font-family:inherit
}

.shell{
  height:100dvh;
  min-height:0;
  overflow:hidden;
  padding:var(--safe-area-inset-top) 0 0;
  background:radial-gradient(900px 500px at 15% 0%,rgba(124,92,255,.45),transparent 55%),radial-gradient(800px 500px at 90% 20%,rgba(0,180,255,.28),transparent 50%),linear-gradient(135deg,#0b1026 0%,#171044 48%,#1d0f3a 100%);
  display:flex;
  justify-content:center
}

.wrap{
  width:100%;
  max-width:1040px;
  height:100%;
  min-height:0;
  margin:0 auto;
  padding:10px 14px;
  display:grid;
  grid-template-columns:360px minmax(0,1fr);
  gap:10px;
  align-items:stretch
}

.left{
  display:flex;
  flex-direction:column;
  gap:8px;
  min-width:0;
  min-height:0;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  padding-right:2px;
  padding-bottom:2px;
  scrollbar-width:thin
}

.eyebrow{
  font-size:10px;
  letter-spacing:.18em;
  font-weight:900;
  color:#ffd166;
  margin:0 0 4px
}

h1{
  font-size:28px;
  line-height:1;
  letter-spacing:-.03em;
  margin:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.sub{
  color:var(--muted);
  font-size:12px;
  line-height:1.35;
  margin:5px 0 0;
  max-width:300px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.sound-btn{
  display:flex;
  align-items:center;
  gap:6px;
  flex:0 0 auto;
  background:rgba(255,255,255,.12);
  border:1px solid var(--line);
  color:#fff;
  border-radius:999px;
  padding:7px 9px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap
}

.sound-btn:hover{
  background:rgba(255,255,255,.2)
}

.badge-row{
  display:flex;
  gap:6px;
  flex-wrap:nowrap;
  margin-top:8px
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:#ffd166;
  color:#241500;
  border-radius:999px;
  padding:5px 7px;
  font-size:11px;
  font-weight:900;
  letter-spacing:0;
  white-space:nowrap;
  flex:0 1 auto;
  min-width:0;
  overflow:hidden
}

.badge.ghost{
  background:rgba(255,255,255,.1);
  color:#fff;
  border:1px solid var(--line)
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
  backdrop-filter:blur(14px);
  box-shadow:0 18px 40px rgba(0,0,0,.22)
}

.label{
  font-size:10px;
  letter-spacing:.14em;
  font-weight:900;
  color:#c7c9e8;
  margin:0 0 7px
}

.label.small{
  margin-bottom:6px
}

.mode-stack{
  display:flex;
  flex-direction:column;
  gap:7px
}

.mode-btn{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  height:46px;
  min-height:46px;
  text-align:left;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  color:#fff;
  border-radius:12px;
  padding:8px 10px;
  cursor:pointer
}

.mode-btn.active{
  background:rgba(255,209,102,.16);
  border-color:#ffd166;
  box-shadow:0 0 0 1px #ffd166
}

.mode-btn b{
  display:block;
  font-size:13px;
  line-height:1.15
}

.mode-btn small{
  display:block;
  color:#c7c9e8;
  font-size:11px;
  line-height:1.25;
  margin-top:1px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.mode-ico{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#ff3b5c;
  display:grid;
  place-items:center;
  font-size:16px;
  flex:0 0 auto
}

.mode-ico.cpu{
  background:#1b1b22;
  border:1px solid #fff3;
  color:#ffd166
}

.radio{
  margin-left:auto;
  font-size:15px;
  color:#ffd166
}

.diff{
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid var(--line)
}

.diff-dim{
  opacity:.72
}

.diff-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px
}

.diff-btn{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  color:#fff;
  border-radius:11px;
  padding:6px 5px;
  cursor:pointer;
  text-align:center;
  height:56px;
  min-height:56px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px
}

.diff-btn b{
  font-size:12px;
  line-height:1.15;
  display:block
}

.diff-btn small{
  font-size:10px;
  line-height:1.2;
  color:#c7c9e8;
  display:block
}

.diff-btn.active{
  background:#7c5cff;
  border-color:#fff;
  box-shadow:0 0 0 1px #fff
}

.score-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px
}

.score-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:13px;
  padding:8px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  height:58px;
  min-height:58px;
  overflow:hidden
}

.score-card p{
  font-size:10px;
  color:#c7c9e8;
  margin:0;
  white-space:nowrap
}

.score-card strong{
  font-size:18px;
  line-height:1.15;
  display:block
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  flex:0 0 auto
}

.dot.red{
  background:#ff3b5c;
  box-shadow:0 0 12px #ff3b5c
}

.dot.black{
  background:#111;
  border:2px solid #fff
}

.eq{
  font-weight:900;
  font-size:18px;
  color:#ffd166
}

.status-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:15px;
  padding:10px 12px
}

.turn-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.turn-name{
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:900;
  font-size:15px;
  margin:2px 0 0
}

.turn-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  display:inline-block
}

.turn-dot.red{
  background:#ff3b5c
}

.turn-dot.black{
  background:#111;
  border:2px solid #fff
}

.round{
  text-align:right;
  flex:0 0 auto
}

.round span{
  display:block;
  font-size:9px;
  letter-spacing:.12em;
  color:#c7c9e8
}

.round strong{
  font-size:18px;
  line-height:1.1
}

.starter-banner{
  margin-top:8px;
  background:rgba(255,209,102,.14);
  border:1px solid rgba(255,209,102,.35);
  border-radius:9px;
  padding:6px 8px;
  font-size:11px
}

.starter-banner.black{
  background:rgba(255,255,255,.09);
  border-color:rgba(255,255,255,.22)
}

.starter-banner span{
  color:#c7c9e8;
  font-size:11px
}

.msg{
  font-size:12px;
  line-height:1.4;
  color:#eef0ff;
  margin:7px 0 0
}

.warn{
  color:#ffd166;
  font-size:12px;
  font-weight:800;
  margin:5px 0 0
}

.must{
  color:#7dffc4;
  font-size:12px;
  font-weight:800;
  margin:5px 0 0
}

.chain{
  color:#ffd166;
  font-size:12px;
  font-weight:800;
  margin:5px 0 0
}

.counts{
  display:flex;
  justify-content:space-between;
  gap:6px;
  border-top:1px solid var(--line);
  margin-top:7px;
  padding-top:7px;
  font-size:10px;
  color:#c7c9e8;
  flex-wrap:wrap
}

.mini{
  width:9px;
  height:9px;
  border-radius:50%;
  display:inline-block;
  margin-right:3px
}

.mini.red{
  background:#ff3b5c
}

.mini.black{
  background:#111;
  border:1px solid #fff
}

.actions{
  display:grid;
  grid-template-columns:1.3fr 1fr;
  gap:8px
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:0;
  border-radius:11px;
  padding:0 10px;
  height:42px;
  min-height:42px;
  font-size:12.5px;
  font-weight:900;
  cursor:pointer;
  white-space:nowrap
}

.btn.primary{
  background:linear-gradient(90deg,#ff3b5c,#ff7a3d);
  color:#fff;
  box-shadow:0 10px 22px rgba(255,59,92,.35)
}

.btn.ghost-btn{
  background:rgba(255,255,255,.1);
  border:1px solid var(--line);
  color:#fff
}

.back-link{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:#fff;
  text-decoration:none;
  font-weight:800;
  font-size:11.5px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  padding:8px;
  border-radius:11px
}

.rules{
  font-size:10.5px;
  line-height:1.4;
  color:#c7c9e8;
  margin:0;
  text-align:center;
  background:rgba(0,0,0,.18);
  border-radius:10px;
  padding:7px 9px
}

.rules b{
  color:#fff
}

.right{
  min-width:0;
  min-height:0;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center
}

.board-wrap{
  width:min(100%,540px,calc(100dvh - 96px));
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center
}

.board-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:11px;
  color:#d8daf5;
  margin-bottom:7px;
  flex-wrap:wrap
}

.board-top span:first-child{
  display:flex;
  gap:6px;
  align-items:center
}

.hint{
  background:rgba(255,255,255,.1);
  padding:5px 8px;
  border-radius:999px;
  white-space:nowrap
}

.board{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);
  border-radius:18px;
  overflow:hidden;
  border:6px solid #2a1a0e;
  box-shadow:0 28px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.12);
  background:#2a1a0e
}

.cell{
  position:relative;
  border:0;
  padding:0;
  cursor:pointer
}

.cell.light{
  background:#ecd9b0
}

.cell.dark{
  background:#7a4a2b
}

.cell.valid{
  outline:3px solid #22d3a5;
  outline-offset:-3px;
  z-index:2
}

.cell.cap{
  outline-color:#ffd166
}

.cell.last{
  box-shadow:inset 0 0 0 4px rgba(255,209,102,.55)
}

.cell.selected-cell{
  box-shadow:inset 0 0 0 4px #22d3a5
}

.target{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:34%;
  height:34%;
  border-radius:50%;
  background:rgba(34,211,165,.85);
  box-shadow:0 0 0 5px rgba(34,211,165,.25),0 0 18px #22d3a5;
  z-index:3;
  pointer-events:none
}

.cell.cap .target{
  background:#ffd166;
  box-shadow:0 0 0 5px rgba(255,209,102,.25),0 0 18px #ffd166
}

.coord{
  position:absolute;
  left:4px;
  bottom:2px;
  font-size:9px;
  font-weight:800;
  color:rgba(0,0,0,.35)
}

.pieces-layer{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:5
}

.piece-pos{
  position:absolute;
  width:12.5%;
  height:12.5%;
  display:grid;
  place-items:center;
  transition:left .28s ease,top .28s ease,opacity .3s,transform .3s
}

.piece{
  width:82%;
  height:82%;
  border-radius:50%;
  position:relative;
  display:grid;
  place-items:center;
  box-shadow:0 6px 10px rgba(0,0,0,.45),inset 0 -5px 8px rgba(0,0,0,.28),inset 0 3px 5px rgba(255,255,255,.35);
  border:2px solid rgba(255,255,255,.25)
}

.piece-pos.red .piece{
  background:radial-gradient(circle at 35% 30%,#ff7a8f,#e81f47 58%,#8f0f2a)
}

.piece-pos.black .piece{
  background:radial-gradient(circle at 35% 30%,#4a4a58,#17171f 58%,#000)
}

.inner-ring{
  position:absolute;
  width:62%;
  height:62%;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.45)
}

.crown{
  font-size:clamp(20px,4.5vw,34px);
  color:#ffd166;
  text-shadow:0 2px 0 #7a4a00,0 0 14px #ffd166;
  line-height:1
}

.piece-dot{
  width:18%;
  height:18%;
  border-radius:50%;
  background:rgba(255,255,255,.65)
}

.piece-selected .piece{
  box-shadow:0 0 0 3px #22d3a5,0 0 22px #22d3a5,0 8px 12px rgba(0,0,0,.4);
  transform:scale(1.06)
}

.piece-chain .piece{
  box-shadow:0 0 0 3px #ffd166,0 0 24px #ffd166
}

.piece-pos.fading{
  opacity:0;
  transform:scale(.4) rotate(40deg)
}

.piece-pos.promoting .piece{
  animation:promote .9s ease
}

@keyframes promote{
  0%{
    transform:scale(1)
  }

  30%{
    transform:scale(1.25) rotate(-6deg);
    box-shadow:0 0 30px #ffd166
  }

  60%{
    transform:scale(1.1)
  }

  100%{
    transform:scale(1)
  }
}

.win-overlay{
  position:absolute;
  inset:0;
  background:rgba(5,5,18,.72);
  backdrop-filter:blur(3px);
  display:grid;
  place-items:center;
  z-index:20;
  overflow:hidden;
  padding:18px
}

.win-box{
  background:#171233;
  border:1px solid rgba(255,255,255,.2);
  border-radius:18px;
  padding:20px;
  text-align:center;
  position:relative;
  z-index:2;
  max-width:340px
}

.win-box h2{
  font-size:clamp(24px,6vw,32px);
  margin:6px 0
}

.win-box p{
  color:#c7c9e8;
  font-size:13px;
  line-height:1.5
}

.win-crown{
  font-size:38px;
  color:#ffd166
}

.confetti span{
  position:absolute;
  top:-20px;
  width:9px;
  height:16px;
  border-radius:2px;
  animation:fall linear infinite
}

@keyframes fall{
  to{
    transform:translateY(620px) rotate(540deg)
  }
}

.board-foot{
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:#c7c9e8;
  font-size:10px;
  margin-top:7px;
  flex-wrap:wrap
}

.board-foot span{
  display:flex;
  gap:5px;
  align-items:center
}

@media(max-width:900px){
  .wrap{
    display:flex;
    flex-direction:column;
    max-width:620px;
    padding:8px 10px;
    gap:8px
  }

  .left{
    flex:0 1 auto;
    max-height:50dvh;
    height:auto;
    gap:8px
  }

  .right{
    flex:1 1 0
  }

  .sub{
    max-width:none
  }

  .board-wrap{
    width:min(100%,calc(50dvh - 52px));
    margin:0 auto
  }

  .board{
    border-width:4px;
    border-radius:14px
  }

  .score-card{
    padding:8px
  }

  .card{
    padding:12px
  }

  .status-card{
    padding:10px 11px
  }

  h1{
    font-size:28px
  }

  .board-top{
    margin-bottom:6px
  }
}

@media(max-width:420px){
  .diff-grid{
    grid-template-columns:1fr 1fr 1fr
  }

  .diff-btn small{
    font-size:8px
  }

  .board-wrap{
    width:min(94vw,calc(50dvh - 52px))
  }

  .board-top{
    font-size:10px
  }

  .actions{
    grid-template-columns:1fr 1fr
  }

  .score-card strong{
    font-size:18px
  }

  .mode-btn small{
    font-size:10px
  }
}

@media(max-height:620px) and (min-width:901px){
  .board-wrap{
    width:min(100%,500px,calc(100dvh - 88px))
  }

  .rules{
    display:none
  }
}
